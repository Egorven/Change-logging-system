{% extends "base.html" %}

{% block title %}Проекты — ChangeLog{% endblock %}

{% block content %}
  <h1>Проекты <span class="text-muted fs-5">({{ projects|length }})</span></h1>

  {% if projects %}
    <ul class="list-group">
      {% for project in projects %}
        <li class="list-group-item">
          <a href="{% url 'projects:project_detail' project.id %}">
            {{ project.name|truncatechars:60 }}
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <div class="alert alert-info mt-3">Проектов пока нет.</div>
  {% endif %}
{% endblock %}
